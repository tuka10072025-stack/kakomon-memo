<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f1fa" />
  <title>過去問メモ</title>
  <style>
    :root{
      --bg:#f7f4fb;
      --card:#ffffff;
      --text:#222;
      --sub:#777;
      --line:#e8e2ef;
      --accent:#6d5f86;
      --ok:#2e9b63;
      --ng:#d95050;
      --chip:#eeeaf3;
      --shadow:0 8px 28px rgba(46,33,62,.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
    body{min-height:100vh}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
    .topbar{
      position:sticky;top:0;z-index:20;
      background:rgba(247,244,251,.94);backdrop-filter:blur(12px);
      padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
      border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:10px
    }
    .topbar h1{font-size:21px;margin:0}
    .small{font-size:13px;color:var(--sub)}
    .screen{display:none;padding:16px}
    .screen.active{display:block}
    .card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .homeBtn{
      border:0;border-radius:18px;padding:20px 14px;background:var(--card);box-shadow:var(--shadow);
      min-height:96px;text-align:left
    }
    .homeBtn strong{display:block;font-size:18px;margin-bottom:5px}
    .homeBtn span{color:var(--sub);font-size:13px}
    .primary{border:0;background:var(--accent);color:white;border-radius:14px;padding:13px 16px;font-weight:700}
    .secondary{border:1px solid var(--line);background:white;color:var(--text);border-radius:14px;padding:12px 15px}
    .danger{border:1px solid #f0c9c9;background:#fff7f7;color:var(--ng);border-radius:14px;padding:11px 14px}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .list{display:flex;flex-direction:column;gap:12px;margin-top:14px}
    .qitem{background:white;border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center}
    .thumb{width:88px;height:110px;border-radius:12px;background:#f0edf4;object-fit:cover;flex:0 0 auto}
    .qmeta{min-width:0;flex:1}
    .qmeta strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
    .chips{display:flex;gap:6px;flex-wrap:wrap}
    .chip{background:var(--chip);border-radius:999px;padding:5px 9px;font-size:12px;color:#5f556d}
    .chip.ok{background:#e6f5ec;color:#207445}
    .chip.ng{background:#fdeaea;color:#a93a3a}
    .empty{padding:42px 12px;text-align:center;color:var(--sub)}
    .viewerWrap{overflow:hidden;touch-action:pan-y}
    .slides{display:flex;width:200%;transition:transform .22s ease}
    .slides.memo{transform:translateX(-50%)}
    .slide{width:50%;flex:0 0 50%}
    .imageCard{background:white;border:1px solid var(--line);border-radius:22px;padding:10px;box-shadow:var(--shadow)}
    .questionImg{width:100%;max-height:68vh;object-fit:contain;border-radius:16px;display:block;background:#f6f4f8}
    .answerImg{width:100%;max-height:80vh;object-fit:contain;border-radius:16px;display:block;background:#f6f4f8}
    .answerItem{position:relative}
    .removeAnswer{position:absolute;right:10px;top:10px;border:0;border-radius:999px;background:rgba(0,0,0,.6);color:white;width:32px;height:32px;font-weight:800}
    .statusRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .statusBtn{border:2px solid transparent;background:white;border-radius:16px;padding:14px;font-weight:800;box-shadow:var(--shadow)}
    .statusBtn.ok{color:var(--ok)}
    .statusBtn.ng{color:var(--ng)}
    .statusBtn.ok.selected{border-color:var(--ok);background:#eef9f3}
    .statusBtn.ng.selected{border-color:var(--ng);background:#fff0f0}
    .hint{text-align:center;color:var(--sub);font-size:13px;margin:12px 0 0}
    .memoCard{background:white;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
    .memoBlock{margin-bottom:16px}
    .memoBlock:last-child{margin-bottom:0}
    .memoLabel{font-size:20px;font-weight:800;margin-bottom:7px}
    textarea{width:100%;min-height:104px;border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical;background:#fcfbfd;outline:none}
    textarea:focus{border-color:#b9aec9;box-shadow:0 0 0 3px rgba(109,95,134,.08)}
    .sectionTitle{font-size:19px;margin:4px 0 12px}
    .row{display:flex;gap:10px;align-items:center}
    .row.between{justify-content:space-between}
    .muted{color:var(--sub)}
    .addBox{background:white;border:1px dashed #cfc6d9;border-radius:20px;padding:20px;text-align:center}
    input[type=file]{width:100%}
    .bottomBar{
      position:fixed;left:0;right:0;bottom:0;z-index:30;
      padding:10px 14px calc(10px + env(safe-area-inset-bottom));
      background:rgba(247,244,251,.96);backdrop-filter:blur(12px);
      border-top:1px solid var(--line)
    }
    .bottomInner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .navBtn{border:0;border-radius:14px;background:white;padding:11px 8px;font-weight:700}
    .navBtn.active{background:var(--accent);color:white}
    .badge{font-size:12px;color:var(--sub);margin-top:4px}
    @media (max-width:420px){
      .grid{grid-template-columns:1fr 1fr}
      .homeBtn{min-height:88px}
      .thumb{width:76px;height:96px}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1 id="pageTitle">過去問メモ</h1>
      <div class="small" id="pageSub">スクショで覚える・復習する</div>
    </div>
    <button class="secondary" id="backBtn" style="display:none">戻る</button>
  </header>

  <main>
    <section id="homeScreen" class="screen active">
      <div class="grid">
        <button class="homeBtn" data-filter="due3">
          <strong>3日前</strong><span>3日前に解いた問題を復習</span>
        </button>
        <button class="homeBtn" data-filter="due7">
          <strong>1週間前</strong><span>1週間前に解いた問題を復習</span>
        </button>
        <button class="homeBtn" data-filter="wrong">
          <strong>不正解</strong><span>×だった問題だけ確認</span>
        </button>
        <button class="homeBtn" data-filter="all">
          <strong>すべて</strong><span>登録した問題を全部見る</span>
        </button>
      </div>

      <div style="height:16px"></div>

      <div class="card">
        <div class="row between">
          <div>
            <strong>問題を追加</strong>
            <div class="badge">問題アプリのスクショを選ぶだけ</div>
          </div>
          <button class="primary" id="chooseImageBtn">＋ 追加</button>
        </div>
        <input id="imageInput" type="file" accept="image/*" multiple hidden>
      </div>

      <div class="card" style="margin-top:14px">
        <div class="row between">
          <strong>現在の登録数</strong>
          <strong id="countText">0問</strong>
        </div>
      </div>
    </section>

    <section id="listScreen" class="screen">
      <div class="row between">
        <h2 class="sectionTitle" id="listTitle">問題一覧</h2>
        <button class="secondary" id="listAddBtn">＋追加</button>
      </div>
      <div id="questionList" class="list"></div>
    </section>

    <section id="viewerScreen" class="screen">
      <div class="viewerWrap" id="viewerWrap">
        <div class="slides" id="slides">
          <div class="slide">
            <div class="imageCard">
              <img id="viewerImage" class="questionImg" alt="問題画像">
            </div>
            <div class="statusRow">
              <button class="statusBtn ok" id="correctBtn">○ 正解</button>
              <button class="statusBtn ng" id="wrongBtn">× 不正解</button>
            </div>
            <div class="card" style="margin-top:12px">
              <div class="small">最後に解いた日</div>
              <strong id="lastStudiedText">未回答</strong>
            </div>

            <div class="card" style="margin-top:12px">
              <div class="row between">
                <div>
                  <strong>解答・解説スクショ</strong>
                  <div class="small">複数枚追加できます</div>
                </div>
                <button class="secondary" id="addAnswerBtn">＋ 追加</button>
              </div>
              <input id="answerInput" type="file" accept="image/*" multiple hidden>
              <div id="answerList" style="display:flex;flex-direction:column;gap:12px;margin-top:12px"></div>
            </div>

            <p class="hint">← 左へスワイプするとメモ</p>
          </div>

          <div class="slide">
            <div class="memoCard">
              <div class="row between" style="margin-bottom:12px">
                <strong>選択肢メモ</strong>
                <span class="small">自動保存</span>
              </div>
              <div class="memoBlock">
                <div class="memoLabel">イ</div>
                <textarea id="memoI" placeholder="イについて覚えておきたいこと"></textarea>
              </div>
              <div class="memoBlock">
                <div class="memoLabel">ロ</div>
                <textarea id="memoRo" placeholder="ロについて覚えておきたいこと"></textarea>
              </div>
              <div class="memoBlock">
                <div class="memoLabel">ハ</div>
                <textarea id="memoHa" placeholder="ハについて覚えておきたいこと"></textarea>
              </div>
              <div class="memoBlock">
                <div class="memoLabel">ニ</div>
                <textarea id="memoNi" placeholder="ニについて覚えておきたいこと"></textarea>
              </div>
            </div>
            <p class="hint">右へスワイプすると問題へ戻る →</p>
          </div>
        </div>
      </div>

      <div class="toolbar" style="margin-top:14px">
        <button class="secondary" id="prevBtn">前の問題</button>
        <button class="secondary" id="nextBtn">次の問題</button>
        <button class="danger" id="deleteBtn">削除</button>
      </div>
    </section>
  </main>
</div>

<div class="bottomBar">
  <div class="bottomInner">
    <button class="navBtn active" id="homeNav">ホーム</button>
    <button class="navBtn" id="allNav">問題一覧</button>
    <button class="navBtn" id="wrongNav">不正解</button>
  </div>
</div>

<script>
(() => {
  const DB_NAME = 'kakomonMemoDB';
  const STORE = 'questions';
  let db;
  let currentFilter = 'all';
  let currentIds = [];
  let currentIndex = 0;
  let currentQuestion = null;
  let memoSaveTimer = null;

  const $ = id => document.getElementById(id);

  function openDB(){
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open(DB_NAME,1);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains(STORE)){
          d.createObjectStore(STORE,{keyPath:'id'});
        }
      };
      req.onsuccess = e => { db = e.target.result; resolve(db); };
      req.onerror = () => reject(req.error);
    });
  }

  function putQuestion(q){
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE,'readwrite');
      tx.objectStore(STORE).put(q);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }

  function getQuestion(id){
    return new Promise((resolve,reject)=>{
      const req = db.transaction(STORE,'readonly').objectStore(STORE).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function getAll(){
    return new Promise((resolve,reject)=>{
      const req = db.transaction(STORE,'readonly').objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  function deleteQuestion(id){
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE,'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }

  function showScreen(name){
    ['homeScreen','listScreen','viewerScreen'].forEach(id => $(id).classList.remove('active'));
    $(name).classList.add('active');
    $('backBtn').style.display = name === 'homeScreen' ? 'none' : 'inline-block';
    $('pageTitle').textContent = name === 'viewerScreen' ? '問題' : name === 'listScreen' ? '問題一覧' : '過去問メモ';
    $('pageSub').textContent = name === 'viewerScreen' ? '左スワイプでメモ' : name === 'listScreen' ? 'タップして開く' : 'スクショで覚える・復習する';
    updateNav(name);
  }

  function updateNav(name){
    ['homeNav','allNav','wrongNav'].forEach(id => $(id).classList.remove('active'));
    if(name === 'homeScreen') $('homeNav').classList.add('active');
    else if(currentFilter === 'wrong') $('wrongNav').classList.add('active');
    else $('allNav').classList.add('active');
  }

  function dateText(ts){
    if(!ts) return '未回答';
    return new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'numeric',day:'numeric'}).format(new Date(ts));
  }

  function startOfDay(ts){
    const d = new Date(ts);
    d.setHours(0,0,0,0);
    return d.getTime();
  }

  function dayDiff(ts){
    if(!ts) return null;
    const now = startOfDay(Date.now());
    const then = startOfDay(ts);
    return Math.round((now - then) / 86400000);
  }

  function filterQuestions(all, filter){
    const sorted = [...all].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(filter === 'wrong') return sorted.filter(q => q.result === 'wrong');
    if(filter === 'due3') return sorted.filter(q => dayDiff(q.lastStudiedAt) === 3);
    if(filter === 'due7') return sorted.filter(q => dayDiff(q.lastStudiedAt) === 7);
    return sorted;
  }

  async function refreshCount(){
    const all = await getAll();
    $('countText').textContent = `${all.length}問`;
  }

  async function openList(filter='all'){
    currentFilter = filter;
    const all = await getAll();
    const filtered = filterQuestions(all, filter);
    currentIds = filtered.map(q=>q.id);
    const titles = {all:'すべての問題',wrong:'不正解の問題',due3:'3日前に解いた問題',due7:'1週間前に解いた問題'};
    $('listTitle').textContent = titles[filter] || '問題一覧';
    const list = $('questionList');
    list.innerHTML = '';
    if(!filtered.length){
      list.innerHTML = `<div class="empty">該当する問題はありません</div>`;
    } else {
      for(const [index,q] of filtered.entries()){
        const url = URL.createObjectURL(q.image);
        const el = document.createElement('button');
        el.className='qitem';
        el.style.width='100%';
        el.style.border='1px solid var(--line)';
        el.style.textAlign='left';
        el.innerHTML = `
          <img class="thumb" src="${url}" alt="">
          <div class="qmeta">
            <strong>問題 ${index+1}</strong>
            <div class="chips">
              ${q.result === 'correct' ? '<span class="chip ok">○ 正解</span>' : ''}
              ${q.result === 'wrong' ? '<span class="chip ng">× 不正解</span>' : ''}
              ${!q.result ? '<span class="chip">未回答</span>' : ''}
              <span class="chip">${q.lastStudiedAt ? dateText(q.lastStudiedAt) : '未学習'}</span>
            </div>
          </div>`;
        el.onclick=()=>openViewerById(q.id);
        list.appendChild(el);
      }
    }
    showScreen('listScreen');
  }

  async function openViewerById(id){
    if(!currentIds.includes(id)){
      const all=await getAll();
      currentIds=filterQuestions(all,currentFilter).map(q=>q.id);
    }
    currentIndex=Math.max(0,currentIds.indexOf(id));
    await loadCurrent();
    showScreen('viewerScreen');
  }

  async function loadCurrent(){
    if(!currentIds.length){ await openList(currentFilter); return; }
    const id=currentIds[currentIndex];
    const q=await getQuestion(id);
    if(!q){ await openList(currentFilter); return; }
    currentQuestion=q;
    if($('viewerImage').dataset.url) URL.revokeObjectURL($('viewerImage').dataset.url);
    const url=URL.createObjectURL(q.image);
    $('viewerImage').src=url;
    $('viewerImage').dataset.url=url;
    $('memoI').value=q.memos?.i || '';
    $('memoRo').value=q.memos?.ro || '';
    $('memoHa').value=q.memos?.ha || '';
    $('memoNi').value=q.memos?.ni || '';
    $('correctBtn').classList.toggle('selected',q.result==='correct');
    $('wrongBtn').classList.toggle('selected',q.result==='wrong');
    $('lastStudiedText').textContent=dateText(q.lastStudiedAt);
    if(!q.answers) q.answers=[];
    renderAnswers();
    $('slides').classList.remove('memo');
    $('prevBtn').disabled=currentIndex===0;
    $('nextBtn').disabled=currentIndex===currentIds.length-1;
  }

  async function setResult(result){
    if(!currentQuestion) return;
    currentQuestion.result=result;
    currentQuestion.lastStudiedAt=Date.now();
    await putQuestion(currentQuestion);
    $('correctBtn').classList.toggle('selected',result==='correct');
    $('wrongBtn').classList.toggle('selected',result==='wrong');
    $('lastStudiedText').textContent=dateText(currentQuestion.lastStudiedAt);
  }

  function scheduleMemoSave(){
    clearTimeout(memoSaveTimer);
    memoSaveTimer=setTimeout(async()=>{
      if(!currentQuestion) return;
      currentQuestion.memos={
        i:$('memoI').value,
        ro:$('memoRo').value,
        ha:$('memoHa').value,
        ni:$('memoNi').value
      };
      await putQuestion(currentQuestion);
    },250);
  }

  async function addImages(files){
    if(!files?.length) return;
    const now=Date.now();
    let n=0;
    for(const file of files){
      const q={
        id: crypto.randomUUID ? crypto.randomUUID() : `${now}-${Math.random()}`,
        image:file,
        answers:[],
        createdAt:now+n,
        lastStudiedAt:null,
        result:null,
        memos:{i:'',ro:'',ha:'',ni:''}
      };
      await putQuestion(q);
      n++;
    }
    $('imageInput').value='';
    await refreshCount();
    await openList('all');
  }


  let answerUrls = [];

  function renderAnswers(){
    answerUrls.forEach(u=>URL.revokeObjectURL(u));
    answerUrls=[];
    const box=$('answerList');
    if(!box || !currentQuestion) return;
    box.innerHTML='';
    const answers=currentQuestion.answers || [];
    if(!answers.length){
      box.innerHTML='<div class="small">まだ解答・解説スクショはありません。</div>';
      return;
    }
    answers.forEach((blob,idx)=>{
      const url=URL.createObjectURL(blob);
      answerUrls.push(url);
      const item=document.createElement('div');
      item.className='answerItem imageCard';
      item.innerHTML=`<img class="answerImg" src="${url}" alt="解答画像 ${idx+1}"><button class="removeAnswer" aria-label="削除">×</button>`;
      item.querySelector('.removeAnswer').onclick=async()=>{
        if(!confirm(`解答画像 ${idx+1} を削除しますか？`)) return;
        currentQuestion.answers.splice(idx,1);
        await putQuestion(currentQuestion);
        renderAnswers();
      };
      box.appendChild(item);
    });
  }

  async function addAnswers(files){
    if(!currentQuestion || !files?.length) return;
    currentQuestion.answers = currentQuestion.answers || [];
    for(const file of files) currentQuestion.answers.push(file);
    await putQuestion(currentQuestion);
    $('answerInput').value='';
    renderAnswers();
  }

  $('chooseImageBtn').onclick=()=>$('imageInput').click();
  $('listAddBtn').onclick=()=>$('imageInput').click();
  $('imageInput').addEventListener('change',e=>addImages([...e.target.files]));
  $('addAnswerBtn').onclick=()=>$('answerInput').click();
  $('answerInput').addEventListener('change',e=>addAnswers([...e.target.files]));

  document.querySelectorAll('.homeBtn[data-filter]').forEach(btn=>{
    btn.onclick=()=>openList(btn.dataset.filter);
  });

  $('homeNav').onclick=async()=>{ await refreshCount(); showScreen('homeScreen'); };
  $('allNav').onclick=()=>openList('all');
  $('wrongNav').onclick=()=>openList('wrong');
  $('backBtn').onclick=()=>{
    if($('viewerScreen').classList.contains('active')) openList(currentFilter);
    else showScreen('homeScreen');
  };

  $('correctBtn').onclick=()=>setResult('correct');
  $('wrongBtn').onclick=()=>setResult('wrong');

  ['memoI','memoRo','memoHa','memoNi'].forEach(id=>{
    $(id).addEventListener('input',scheduleMemoSave);
  });

  $('prevBtn').onclick=async()=>{
    if(currentIndex>0){ currentIndex--; await loadCurrent(); }
  };
  $('nextBtn').onclick=async()=>{
    if(currentIndex<currentIds.length-1){ currentIndex++; await loadCurrent(); }
  };

  $('deleteBtn').onclick=async()=>{
    if(!currentQuestion) return;
    if(!confirm('この問題を削除しますか？')) return;
    await deleteQuestion(currentQuestion.id);
    currentIds.splice(currentIndex,1);
    if(currentIndex>=currentIds.length) currentIndex=Math.max(0,currentIds.length-1);
    await refreshCount();
    if(currentIds.length) await loadCurrent();
    else await openList(currentFilter);
  };

  let startX=0,startY=0;
  const viewer=$('viewerWrap');
  viewer.addEventListener('touchstart',e=>{
    const t=e.changedTouches[0]; startX=t.clientX; startY=t.clientY;
  },{passive:true});
  viewer.addEventListener('touchend',e=>{
    const t=e.changedTouches[0];
    const dx=t.clientX-startX, dy=t.clientY-startY;
    if(Math.abs(dx)<55 || Math.abs(dx)<Math.abs(dy)*1.2) return;
    if(dx<0) $('slides').classList.add('memo');
    else $('slides').classList.remove('memo');
  },{passive:true});

  openDB().then(async()=>{
    await refreshCount();
  }).catch(err=>{
    alert('保存機能を開始できませんでした。Safariで開き直してください。');
    console.error(err);
  });
})();
</script>
</body>
</html>
