<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="過去問メモ">
  <meta name="theme-color" content="#f7f4fb">
  <title>過去問メモ</title>
  <style>
    :root{
      --bg:#f7f4fb; --card:#fff; --text:#222; --sub:#777;
      --line:#e8e2ef; --accent:#75658e; --chip:#eeeaf3;
      --shadow:0 8px 28px rgba(46,33,62,.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
    .topbar{
      position:sticky;top:0;z-index:20;background:rgba(247,244,251,.94);
      backdrop-filter:blur(16px);padding:calc(18px + env(safe-area-inset-top)) 20px 16px;
      border-bottom:1px solid var(--line)
    }
    .toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .title{font-size:28px;font-weight:800;letter-spacing:.02em}
    .subtitle{font-size:14px;color:var(--sub);margin-top:3px}
    .btn{
      border:1px solid var(--line);background:#fff;color:var(--text);
      border-radius:18px;padding:13px 18px;font-weight:700
    }
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.small{padding:10px 14px;border-radius:14px}
    .content{padding:18px 16px;max-width:760px;margin:0 auto}
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:24px;
      box-shadow:var(--shadow);padding:18px;margin-bottom:16px
    }
    .section-title{font-size:20px;font-weight:800;margin-bottom:3px}
    .section-sub{font-size:13px;color:var(--sub);margin-bottom:14px}
    .upload{
      display:flex;align-items:center;justify-content:center;min-height:110px;
      border:1.5px dashed #cbc1d9;border-radius:20px;background:#fbfaff;color:var(--accent);
      font-weight:800;text-align:center;padding:18px
    }
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .thumb-wrap{position:relative;background:#f4f0f8;border-radius:18px;overflow:hidden;aspect-ratio:3/4}
    .thumb{width:100%;height:100%;object-fit:cover;display:block}
    .thumb.contain{object-fit:contain;background:#faf9fc}
    .x{
      position:absolute;right:8px;top:8px;width:30px;height:30px;border:0;border-radius:50%;
      background:rgba(0,0,0,.72);color:#fff;font-weight:800
    }
    .input{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;margin-top:10px}
    textarea.input{min-height:110px;resize:vertical;line-height:1.55}
    .memo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .memo-box{background:#faf8fc;border:1px solid var(--line);border-radius:18px;padding:12px}
    .memo-label{font-weight:800;margin-bottom:7px}
    .memo-box textarea{width:100%;border:0;background:transparent;min-height:95px;resize:vertical;outline:none;line-height:1.5}
    .empty{padding:50px 20px;text-align:center;color:var(--sub)}
    .list{display:grid;gap:12px}
    .item{
      background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px;
      display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center
    }
    .item-thumb{
      width:92px;height:110px;border-radius:14px;background:#f4f0f8;object-fit:cover
    }
    .item-title{font-size:17px;font-weight:800;margin-bottom:6px}
    .item-sub{font-size:13px;color:var(--sub)}
    .viewer-card{padding:0;overflow:hidden}
    .viewer-head{padding:18px 18px 10px}
    .big-image-box{
      margin:0 18px 12px;border:1px solid var(--line);border-radius:22px;overflow:hidden;
      min-height:300px;max-height:68vh;background:#faf9fc;display:flex;align-items:center;justify-content:center
    }
    .big-image{display:block;width:100%;height:auto;max-height:68vh;object-fit:contain}
    .image-error{padding:40px 18px;text-align:center;color:var(--sub)}
    .hint{text-align:center;color:var(--sub);font-size:13px;padding:0 18px 18px}
    .strip{display:flex;gap:10px;overflow-x:auto;padding:0 18px 18px}
    .strip img{width:100px;height:110px;object-fit:cover;border-radius:14px;border:1px solid var(--line);flex:0 0 auto}
    .pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:0 18px 18px}
    .pager button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 15px}
    .bottomnav{
      position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
      display:flex;gap:12px;background:rgba(247,244,251,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line)
    }
    .bottomnav button{flex:1;border:0;border-radius:18px;padding:16px;font-size:17px;font-weight:800;background:#fff;color:#1687e8}
    .bottomnav button.active{background:var(--accent);color:#fff}
    .full{
      position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.95);display:none;
      align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))
    }
    .full.open{display:flex}
    .full img{max-width:100%;max-height:100%;object-fit:contain}
    .full .close{
      position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top));
      width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:#111;font-size:25px
    }
    .hidden{display:none!important}
    .notice{font-size:13px;color:#8a6f45;background:#fff8e8;border:1px solid #f0dfb8;border-radius:14px;padding:10px 12px;margin-top:10px}
    @media (max-width:420px){
      .memo-grid{grid-template-columns:1fr}
      .grid{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="toprow">
      <div>
        <div class="title" id="screenTitle">過去問メモ</div>
        <div class="subtitle" id="screenSub">問題画像とメモをシンプルに保存</div>
      </div>
      <button class="btn hidden" id="backBtn" onclick="goHome()">戻る</button>
    </div>
  </header>

  <main class="content">
    <section id="homeScreen">
      <div class="card">
        <div class="section-title">新しい問題</div>
        <div class="section-sub">問題画像を追加して保存します</div>
        <label class="upload">
          ＋ 問題画像を追加
          <input id="newProblemInput" type="file" accept="image/*" multiple hidden>
        </label>
        <div id="newProblemPreview" class="grid" style="margin-top:12px"></div>
        <button id="saveNewBtn" class="btn primary" style="width:100%;margin-top:14px" onclick="saveNewQuestion()">問題を保存</button>
      </div>
      <div class="card">
        <div class="section-title">登録した問題</div>
        <div class="section-sub"><span id="countText">0件</span></div>
        <div id="questionList" class="list"></div>
      </div>
    </section>

    <section id="viewerScreen" class="hidden">
      <div class="card viewer-card" id="swipeArea">
        <div class="viewer-head">
          <div class="section-title" id="viewerModeTitle">問題</div>
          <div class="section-sub" id="viewerModeSub">左スワイプでメモ</div>
        </div>

        <div id="problemPane">
          <div id="problemBigBox" class="big-image-box"></div>
          <div class="hint">画像をタップすると大きく開きます</div>
          <div id="problemPager" class="pager"></div>

          <div class="card" style="margin:14px 18px 18px;padding:16px">
            <div class="toprow">
              <div>
                <div class="section-title" style="font-size:18px">解答・解説スクショ</div>
                <div class="section-sub" style="margin:2px 0 0">複数枚追加できます</div>
              </div>
              <label class="btn small">＋ 追加<input id="answerInput" type="file" accept="image/*" multiple hidden></label>
            </div>
            <div id="answerStrip" class="strip" style="padding:14px 0 0"></div>
            <div id="answerEmpty" class="item-sub" style="padding-top:14px">まだ解答・解説スクショはありません。</div>
          </div>
          <div class="hint">← 左へスワイプするとメモ</div>
        </div>

        <div id="memoPane" class="hidden">
          <div class="card" style="margin:0 18px 18px;padding:16px">
            <div class="section-title" style="font-size:18px">メモ</div>
            <div class="section-sub">イ・ロ・ハ・ニを短く残せます</div>
            <div class="memo-grid">
              <div class="memo-box"><div class="memo-label">イ</div><textarea id="memoI" oninput="queueMemoSave()"></textarea></div>
              <div class="memo-box"><div class="memo-label">ロ</div><textarea id="memoRo" oninput="queueMemoSave()"></textarea></div>
              <div class="memo-box"><div class="memo-label">ハ</div><textarea id="memoHa" oninput="queueMemoSave()"></textarea></div>
              <div class="memo-box"><div class="memo-label">ニ</div><textarea id="memoNi" oninput="queueMemoSave()"></textarea></div>
            </div>
            <div class="hint" style="padding:16px 0 0">→ 右へスワイプすると問題</div>
          </div>
        </div>
      </div>

      <button class="btn" style="width:100%;margin-top:8px;color:#b33" onclick="deleteCurrent()">この問題を削除</button>
    </section>
  </main>

  <nav class="bottomnav">
    <button id="homeNav" class="active" onclick="goHome()">ホーム</button>
    <button id="listNav" onclick="scrollToList()">問題一覧</button>
  </nav>
</div>

<div id="fullViewer" class="full" onclick="closeFull()">
  <button class="close" onclick="closeFull()">×</button>
  <img id="fullImage" onclick="event.stopPropagation()">
</div>

<script>
const DB_NAME='kakomonMemoDB';
const STORE='questions';
const DB_VERSION=1;

let db=null;
let current=null;
let currentProblemIndex=0;
let pendingNewImages=[];
let memoTimer=null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE)){
        d.createObjectStore(STORE,{keyPath:'id'});
      }
    };
    req.onsuccess=()=>{db=req.result;resolve(db)};
    req.onerror=()=>reject(req.error);
  });
}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function getAll(){
  return new Promise((resolve,reject)=>{
    const r=tx().getAll(); r.onsuccess=()=>resolve(r.result||[]); r.onerror=()=>reject(r.error);
  });
}
function getOne(id){
  return new Promise((resolve,reject)=>{
    const r=tx().get(id); r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  });
}
function putOne(obj){
  return new Promise((resolve,reject)=>{
    const r=tx('readwrite').put(obj); r.onsuccess=()=>resolve(); r.onerror=()=>reject(r.error);
  });
}
function deleteOne(id){
  return new Promise((resolve,reject)=>{
    const r=tx('readwrite').delete(id); r.onsuccess=()=>resolve(); r.onerror=()=>reject(r.error);
  });
}

function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader(); fr.onload=()=>resolve(fr.result); fr.onerror=()=>reject(fr.error); fr.readAsDataURL(file);
  });
}
async function compressImage(file){
  const src=await readFileAsDataURL(file);
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const max=1600;
      let w=img.width,h=img.height;
      if(w>max||h>max){
        const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);
      }
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',0.72));
    };
    img.onerror=reject;img.src=src;
  });
}

function normalizeMemo(q){
  const m=q.memo||q.memos||{};
  return {
    i:m.i ?? m.I ?? q.memoI ?? q.i ?? '',
    ro:m.ro ?? m.ロ ?? q.memoRo ?? q.ro ?? '',
    ha:m.ha ?? m.ハ ?? q.memoHa ?? q.ha ?? '',
    ni:m.ni ?? m.ニ ?? q.memoNi ?? q.ni ?? ''
  };
}
function candidates(q,type){
  const problemKeys=['problemImages','questionImages','images','problemScreenshots','questionScreenshots','problemImage','questionImage','image'];
  const answerKeys=['answerImages','solutionImages','explanationImages','answerScreenshots','solutionScreenshots','answerImage','solutionImage'];
  const keys=type==='problem'?problemKeys:answerKeys;
  let out=[];
  for(const k of keys){
    const v=q?.[k];
    if(Array.isArray(v)) out.push(...v);
    else if(v!=null) out.push(v);
  }
  return out.filter(Boolean);
}
function normalizeRecord(q){
  return {
    ...q,
    id:q.id ?? makeId(),
    problemImages:candidates(q,'problem'),
    answerImages:candidates(q,'answer'),
    memo:normalizeMemo(q),
    createdAt:q.createdAt ?? q.date ?? Date.now()
  };
}
function clearObjectUrls(){}

function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>resolve(fr.result);
    fr.onerror=()=>reject(fr.error);
    fr.readAsDataURL(blob);
  });
}

async function toRenderable(value){
  if(!value)return null;

  if(typeof value==='string'){
    // Old blob: URLs only live for the session that created them.
    // Never try to open those again on iPhone Safari.
    if(value.startsWith('blob:')) return null;
    return value;
  }

  if(value instanceof Blob) return await blobToDataURL(value);
  if(value instanceof ArrayBuffer) return await blobToDataURL(new Blob([value]));
  if(value.data instanceof Blob) return await blobToDataURL(value.data);
  if(value.blob instanceof Blob) return await blobToDataURL(value.blob);

  const v=value.data || value.src || value.url || value.dataUrl || value.base64 || null;
  if(typeof v==='string' && v.startsWith('blob:')) return null;
  return v;
}

async function makeImg(value,className='thumb'){
  const src=await toRenderable(value);
  if(!src) return makeImageError();

  const img=document.createElement('img');
  img.className=className;
  img.src=src;
  img.onclick=()=>openFull(src);
  img.onerror=()=>img.replaceWith(makeImageError());
  return img;
}
function makeImageError(){
  const d=document.createElement('div');
  d.className='image-error';
  d.innerHTML='この画像は以前の一時保存URLが切れています。<br>この画像だけは復元できないため、もう一度追加してください。';
  return d;
}

document.getElementById('newProblemInput').addEventListener('change',async e=>{
  const files=[...(e.target.files||[])];
  for(const f of files){
    try{pendingNewImages.push(await compressImage(f))}
    catch(err){alert('画像を読み込めませんでした')}
  }
  e.target.value='';
  renderNewPreview();
});
function renderNewPreview(){
  const el=document.getElementById('newProblemPreview');el.innerHTML='';
  pendingNewImages.forEach((src,i)=>{
    const w=document.createElement('div');w.className='thumb-wrap';
    const img=document.createElement('img');img.className='thumb contain';img.src=src;img.onclick=()=>openFull(src);
    const b=document.createElement('button');b.className='x';b.textContent='×';b.onclick=()=>{pendingNewImages.splice(i,1);renderNewPreview()};
    w.append(img,b);el.appendChild(w);
  });
}
async function saveNewQuestion(){
  if(!pendingNewImages.length){alert('問題画像を追加してください');return}
  const obj={
    id:makeId(),
    problemImages:[...pendingNewImages],
    answerImages:[],
    memo:{i:'',ro:'',ha:'',ni:''},
    createdAt:Date.now()
  };
  try{
    await putOne(obj);pendingNewImages=[];renderNewPreview();await loadHome();
  }catch(e){alert('保存できませんでした。画像枚数を減らしてお試しください。')}
}

async function loadHome(){
  clearObjectUrls();
  const all=(await getAll()).map(normalizeRecord).sort((a,b)=>Number(b.createdAt)-Number(a.createdAt));
  document.getElementById('countText').textContent=all.length+'件';
  const list=document.getElementById('questionList');list.innerHTML='';
  if(!all.length){list.innerHTML='<div class="empty">まだ問題がありません</div>';return}
  all.forEach((q,idx)=>{
    const item=document.createElement('div');item.className='item';item.onclick=()=>openQuestion(q.id);
    const first=q.problemImages[0];
    let thumb;
    const src=await toRenderable(first);
    if(src){
      thumb=document.createElement('img');thumb.className='item-thumb';thumb.src=src;
      thumb.onerror=()=>{thumb.style.display='none'};
    }else{
      thumb=document.createElement('div');thumb.className='item-thumb';
    }
    const info=document.createElement('div');
    info.innerHTML='<div class="item-title">問題 '+(idx+1)+'</div><div class="item-sub">問題画像 '+q.problemImages.length+'枚 ・ 解答 '+q.answerImages.length+'枚</div>';
    item.append(thumb,info);list.appendChild(item);
  });
}

async function openQuestion(id){
  clearObjectUrls();
  current=normalizeRecord(await getOne(id));
  if(!current)return;
  currentProblemIndex=0;
  document.getElementById('homeScreen').classList.add('hidden');
  document.getElementById('viewerScreen').classList.remove('hidden');
  document.getElementById('backBtn').classList.remove('hidden');
  document.getElementById('screenTitle').textContent='問題';
  document.getElementById('screenSub').textContent='左スワイプでメモ';
  showProblemPane();
  fillMemo();
  renderProblem();
  renderAnswers();
  window.scrollTo(0,0);
}
async function renderProblem(){
  const box=document.getElementById('problemBigBox');box.innerHTML='';
  const arr=current?.problemImages||[];
  if(!arr.length){box.appendChild(makeImageError());return}
  if(currentProblemIndex>=arr.length)currentProblemIndex=0;
  const img=await makeImg(arr[currentProblemIndex],'big-image');
  box.appendChild(img);

  const pager=document.getElementById('problemPager');pager.innerHTML='';
  if(arr.length>1){
    const prev=document.createElement('button');prev.textContent='← 前';
    prev.onclick=()=>{currentProblemIndex=(currentProblemIndex-1+arr.length)%arr.length;renderProblem()};
    const mid=document.createElement('span');mid.textContent=(currentProblemIndex+1)+' / '+arr.length;
    const next=document.createElement('button');next.textContent='次 →';
    next.onclick=()=>{currentProblemIndex=(currentProblemIndex+1)%arr.length;renderProblem()};
    pager.append(prev,mid,next);
  }
}
document.getElementById('answerInput').addEventListener('change',async e=>{
  if(!current)return;
  const files=[...(e.target.files||[])];
  for(const f of files){
    try{current.answerImages.push(await compressImage(f))}
    catch(err){alert('画像を読み込めませんでした')}
  }
  e.target.value='';
  await putOne(current);
  renderAnswers();
});
async function renderAnswers(){
  const strip=document.getElementById('answerStrip');strip.innerHTML='';
  const arr=current?.answerImages||[];
  document.getElementById('answerEmpty').classList.toggle('hidden',arr.length>0);
  arr.forEach((v,i)=>{
    const wrap=document.createElement('div');wrap.className='thumb-wrap';wrap.style.flex='0 0 auto';
    const img=await makeImg(v,'');img.style.cssText='width:100px;height:110px;object-fit:cover;border-radius:14px;border:1px solid var(--line);display:block';
    const b=document.createElement('button');b.className='x';b.textContent='×';
    b.onclick=async ev=>{ev.stopPropagation();current.answerImages.splice(i,1);await putOne(current);renderAnswers()};
    wrap.append(img,b);strip.appendChild(wrap);
  });
}
function fillMemo(){
  const m=current?.memo||{};
  memoI.value=m.i||'';memoRo.value=m.ro||'';memoHa.value=m.ha||'';memoNi.value=m.ni||'';
}
function queueMemoSave(){
  clearTimeout(memoTimer);
  memoTimer=setTimeout(saveMemo,350);
}
async function saveMemo(){
  if(!current)return;
  current.memo={i:memoI.value,ro:memoRo.value,ha:memoHa.value,ni:memoNi.value};
  await putOne(current);
}

function showProblemPane(){
  problemPane.classList.remove('hidden');memoPane.classList.add('hidden');
  viewerModeTitle.textContent='問題';viewerModeSub.textContent='左スワイプでメモ';
}
function showMemoPane(){
  problemPane.classList.add('hidden');memoPane.classList.remove('hidden');
  viewerModeTitle.textContent='メモ';viewerModeSub.textContent='右スワイプで問題';
}
let sx=0,sy=0;
document.getElementById('swipeArea').addEventListener('touchstart',e=>{
  sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY;
},{passive:true});
document.getElementById('swipeArea').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  const dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)){
    if(dx<0)showMemoPane();else showProblemPane();
  }
},{passive:true});

async function deleteCurrent(){
  if(!current||!confirm('この問題を削除しますか？'))return;
  await deleteOne(current.id);goHome();
}
function goHome(){
  current=null;clearObjectUrls();
  document.getElementById('homeScreen').classList.remove('hidden');
  document.getElementById('viewerScreen').classList.add('hidden');
  document.getElementById('backBtn').classList.add('hidden');
  document.getElementById('screenTitle').textContent='過去問メモ';
  document.getElementById('screenSub').textContent='問題画像とメモをシンプルに保存';
  document.getElementById('homeNav').classList.add('active');
  document.getElementById('listNav').classList.remove('active');
  loadHome();window.scrollTo(0,0);
}
function scrollToList(){
  goHome();
  setTimeout(()=>{
    document.getElementById('questionList').scrollIntoView({behavior:'smooth',block:'start'});
    document.getElementById('homeNav').classList.remove('active');
    document.getElementById('listNav').classList.add('active');
  },80);
}
function openFull(src){
  fullImage.src=src;fullViewer.classList.add('open');
}
function closeFull(){
  fullViewer.classList.remove('open');fullImage.src='';
}
